name: Economic Times Cloud Engine Test

on:
  workflow_dispatch:

jobs:
  test-connectivity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Engine
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test Economic Times Connectivity from Azure Datacenter
        run: |
          python3 test_et.py
